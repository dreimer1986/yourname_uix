name: Auto Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: theme-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read commit message
        id: commit
        run: |
          echo "title=$(git log -1 --format=%s)" >> $GITHUB_OUTPUT
          git log -1 --format=%b > release_body.md

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Package supplemental icons and background
        run: python scripts/package_assets.py

      - name: Bump version tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: master
          tag_prefix: ''
          default_bump: patch
          initial_version: 1.0.3

      - name: Create release
        if: steps.tag.outputs.new_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.commit.outputs.title }}
          body_path: release_body.md
          files: yourname_uix-assets.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
